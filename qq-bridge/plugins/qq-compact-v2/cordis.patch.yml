# qq-compact-v2 bundle patch。
#
# 挂上后在 DSH 里多一个 `/compact-v2` 命令。
#
# 与自带 `/compact` 的区别：
#   /compact       → 走 compactNow()，retainTokens 硬编码 0
#                    ⇒ 只保留最后一条，其余全压掉
#   /compact-v2    → 自己用 tokenMeter 算「尾部保留 N token」的切点，
#                    再调公开接口 compactRegion(start, end)
#                    ⇒ 真正保留指定量
#
# 用法：
#   /compact-v2              按 config.retainTokens（默认 20 万）
#   /compact-v2 dry          只报告范围，不动
#   /compact-v2 150000       临时指定保留 15 万

- insert:
    - id: qq-compact-v2
      name: '@local/qq-compact-v2'
      config:
        retainTokens: 200000
